name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths: ["skyhook-mobile/**"]
  pull_request:
    branches: [main]
    paths: ["skyhook-mobile/**"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: skyhook-mobile

      - name: Analyze
        run: flutter analyze
        working-directory: skyhook-mobile

      - name: Test
        run: flutter test
        working-directory: skyhook-mobile
