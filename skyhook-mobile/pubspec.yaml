name: skyhook_mobile
description: Skyhook Coffee - Next-Generation Luxury Hospitality Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  supabase_flutter: ^2.12.4
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  local_auth: ^3.0.1
  flutter_local_notifications: ^21.0.0
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
